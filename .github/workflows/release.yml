name: Publish release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a pre-release (never becomes the latest release or reaches the in-app updater)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTHOG_CLI_HOST: https://us.posthog.com
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      ANDROID_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;27.1.12297006"
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
      - run: npm ci
      - name: Prepare PostHog source map uploads
        run: |
          if [ -n "$POSTHOG_CLI_API_KEY" ] && [ -n "$POSTHOG_CLI_PROJECT_ID" ]; then
            npm install --global @posthog/cli
          else
            echo "::warning::PostHog source map uploads need POSTHOG_CLI_API_KEY and POSTHOG_CLI_PROJECT_ID. Error events still work, but JavaScript stacks will be minified."
          fi
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Test and build signed APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :protocol:test :app:assembleRelease --no-daemon --max-workers=2
      - name: Generate release assets
        id: version
        run: echo "tag=$(node scripts/release-manifest.cjs)" >> "$GITHUB_OUTPUT"
      - name: Publish APK and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This version already has a release. Increase VERSION_CODE and VERSION_NAME."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL="--prerelease --latest=false"
          else
            CHANNEL="--latest"
          fi
          gh release create "$RELEASE_TAG" dist/TVRemote.apk dist/update.json dist/SHA256SUMS --target "$GITHUB_SHA" --title "TV Remote $RELEASE_TAG" --generate-notes $CHANNEL
      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_RELEASE_KEYSTORE"
